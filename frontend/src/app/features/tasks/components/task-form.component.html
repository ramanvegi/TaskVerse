<section class="panel form-panel"><h3>{{ editingId ? 'Edit Task' : 'Create Task' }}</h3>
  <form [formGroup]="form" (ngSubmit)="save.emit()" class="task-form">
    <label>Project<select formControlName="project"><option [ngValue]="0">Select project</option>@for (project of projects; track project.id) {<option [ngValue]="project.id">{{ project.name }}</option>}</select></label>
    <label>Assignee<select formControlName="assigned_to"><option [ngValue]="null">Unassigned</option>@for (employee of employees; track employee.id) {<option [ngValue]="employee.id">{{ employee.full_name }}</option>}</select></label>
    <label>Title<input formControlName="title" /></label>
    <label>Due date<input type="date" formControlName="due_date" /></label>
    <label>Priority<select formControlName="priority">@for (priority of priorities; track priority) {<option [value]="priority">{{ priority }}</option>}</select></label>
    <label>Status<select formControlName="status">@for (status of statuses; track status) {<option [value]="status">{{ status }}</option>}</select></label>
    <label class="wide">Description<input formControlName="description" /></label>
    <div class="actions"><button type="submit" [disabled]="form.invalid || saving">{{ saving ? 'Saving...' : 'Save' }}</button>@if (editingId) { <button type="button" class="secondary" (click)="cancel.emit()">Cancel</button> }</div>
  </form>@if (error) { <div class="alert">{{ error }}</div> }
</section>
