<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">TV</span>
      <div>
        <h1>TaskVerse</h1>
        <small>Work management</small>
      </div>
    </div>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active"><span>⌂</span>Dashboard</a>
      <a routerLink="/departments" routerLinkActive="active"><span>▦</span>Departments</a>
      <a routerLink="/employees" routerLinkActive="active"><span>👥</span>Employees</a>
      <a routerLink="/projects" routerLinkActive="active"><span>◆</span>Projects</a>
      <a routerLink="/tasks" routerLinkActive="active"><span>✓</span>Tasks</a>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="user-summary">
        <span class="user-avatar">{{ (auth.currentUser()?.first_name || auth.currentUser()?.email || 'U').charAt(0) }}</span>
        <div>
        <strong>{{ auth.currentUser()?.first_name || auth.currentUser()?.email }}</strong>
        <span>{{ auth.currentUser()?.role }}</span>
        </div>
      </div>
      <button type="button" (click)="logout()">Logout</button>
    </header>

    <router-outlet />
  </main>
</div>
