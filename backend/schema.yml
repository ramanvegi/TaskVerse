components:
  schemas:
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        new_password_confirm:
          type: string
          writeOnly: true
      required:
      - new_password
      - new_password_confirm
      - old_password
    DashboardSummary:
      type: object
      properties:
        total_employees:
          type: integer
        total_departments:
          type: integer
        total_projects:
          type: integer
        total_tasks:
          type: integer
        completed_tasks:
          type: integer
        pending_tasks:
          type: integer
        overdue_tasks:
          type: integer
      required:
      - completed_tasks
      - overdue_tasks
      - pending_tasks
      - total_departments
      - total_employees
      - total_projects
      - total_tasks
    Department:
      type: object
      description: Serializer for Department CRUD APIs.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 20
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Employee:
      type: object
      description: Serializer for Employee CRUD APIs.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        department:
          type: integer
        department_detail:
          allOf:
          - $ref: '#/components/schemas/Department'
          readOnly: true
        employee_code:
          type: string
          maxLength: 30
        first_name:
          type: string
          maxLength: 80
        last_name:
          type: string
          maxLength: 80
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 20
        job_title:
          type: string
          maxLength: 100
        hire_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/EmployeeStatusEnum'
        address:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - department_detail
      - email
      - employee_code
      - first_name
      - full_name
      - hire_date
      - id
      - job_title
      - last_name
      - updated_at
    EmployeeStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - ON_LEAVE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
        * `ON_LEAVE` - On Leave
    EmployeesByDepartment:
      type: object
      properties:
        department_id:
          type: integer
        department_name:
          type: string
        employee_count:
          type: integer
      required:
      - department_id
      - department_name
      - employee_count
    HealthData:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
        database:
          type: string
      required:
      - database
      - service
      - status
    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/HealthData'
      required:
      - data
      - message
      - success
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
